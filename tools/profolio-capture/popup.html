<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--ink:#222;--mute:#707070;--accent:#006169;--tint:#F2FAFA;--edge:#CCDFE1;--rule:#E6E6E6}
*{box-sizing:border-box}
body{width:300px;margin:0;padding:16px;font:13px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
h1{margin:0 0 2px;font-size:14px}
p.sub{margin:0 0 14px;color:var(--mute);font-size:12px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
input{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;font:inherit;margin-bottom:12px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--accent);color:#fff;
  font:600 13px/1 inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#out{margin-top:12px;font-size:12px;color:var(--mute);min-height:34px;white-space:pre-wrap}
#out.ok{color:var(--accent)}
#out.err{color:#f73131}
.note{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-size:11px;color:var(--mute)}
</style>
</head>
<body>
  <h1>Profolio Capture</h1>
  <p class="sub">Records layout and computed styles. Never text, values or ids.</p>
  <label for="route">Route</label>
  <input id="route" spellcheck="false">
  <button id="go">Capture</button>
  <div id="out"></div>
  <p class="note">Two files land in Downloads/profolio-capture/. Drop them into
     <code>references/live/</code>.</p>
  <script src="popup.js"></script>
</body>
</html>
