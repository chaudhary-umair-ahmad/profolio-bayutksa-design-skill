# Publishes the design system so the HTML is actually readable.
#
# GitHub renders .md and serves .html as source, so committing HTML alone gets
# you a page of markup. Pages fixes that: after this runs, every reference has a
# URL a designer can open, and so do the dashboard, the component catalogue and
# the combined single-file view.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: Publish the design system

on:
  push:
    branches: [main]
    paths:
      - 'references/**'
      - 'deliverables/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The generated files are committed, so this only proves they are current.
      # It does not regenerate them: that needs the product checkout, which is
      # not available here.
      - name: Check every routed path exists
        run: node scripts/check.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/*            _site/ 2>/dev/null || true
          cp -r references        _site/references
          cp -r deliverables      _site/deliverables
          # a landing page, so the root URL is not a directory listing
          cp docs/index.html      _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
